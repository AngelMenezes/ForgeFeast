services:
  sqlserver:
    image: ${MSSQL_IMAGE:?defina MSSQL_IMAGE no .env}
    container_name: forgefeast-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?defina MSSQL_SA_PASSWORD no .env}
    ports:
      - "${MSSQL_PORT:-1433}:1433"
    volumes:
      - forgefeast-mssql-data:/var/opt/mssql
    healthcheck:
      test:
        - CMD-SHELL
        - /opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -Q "SELECT 1" -b -o /dev/null
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

volumes:
  forgefeast-mssql-data:
    name: forgefeast-mssql-data
