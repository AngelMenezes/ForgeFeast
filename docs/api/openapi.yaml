openapi: 3.0.3
info:
  title: ForgeFeast API
  version: 0.3.0
  description: |
    Contrato da API do ForgeFeast (OP-002). Fonte da verdade conforme ADR-007.
    Todos os endpoints ficam sob /api. Erros seguem ProblemDetails (RFC 9457, ADR-008).
    Erros de validação (400) seguem ADR-013: `errors` é um mapa cuja chave é o nome do
    campo do contrato em camelCase (`date`, `name`, `description`, `weekStart`, `items`).
    Datas são `yyyy-MM-dd`, sem hora e sem fuso. Instantes (`createdAt`, `closesAt`) são
    ISO 8601 com offset.
    Pedidos (F02) seguem ADR-014 (rotas e mensagens), ADR-015 (corte) e ADR-016 (dados).
servers:
  - url: http://localhost:5080
    description: API local (desenvolvimento)
tags:
  - name: Health
    description: Verificação de saúde da API e do banco.
  - name: Menu
    description: Cardápio da semana e pratos por dia útil (F01).
  - name: Orders
    description: Pedido individual por nome e data, com horário de corte (F02).
paths:
  /api/menu:
    get:
      tags: [Menu]
      operationId: getWeekMenu
      summary: Consulta o cardápio da semana, de segunda a sexta, agrupado por dia.
      description: |
        Sempre retorna exatamente cinco dias (segunda a sexta), em ordem de data.
        Dia sem pratos vem com `dishes: []`. Pratos de cada dia em ordem de `id` (ordem de cadastro).
      parameters:
        - name: weekStart
          in: query
          required: true
          description: Segunda-feira que inicia a semana (`yyyy-MM-dd`). Outro dia da semana responde 400.
          schema:
            type: string
            format: date
          example: '2026-10-26'
      responses:
        '200':
          description: Cardápio da semana.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WeekMenu'
              example:
                weekStart: '2026-10-26'
                weekEnd: '2026-10-30'
                days:
                  - date: '2026-10-26'
                    dayOfWeek: Monday
                    dishes:
                      - id: 1
                        date: '2026-10-26'
                        name: Feijoada
                        description: Com arroz, couve e farofa
                      - id: 2
                        date: '2026-10-26'
                        name: Salada de grão-de-bico
                        description: null
                  - date: '2026-10-27'
                    dayOfWeek: Tuesday
                    dishes: []
                  - date: '2026-10-28'
                    dayOfWeek: Wednesday
                    dishes: []
                  - date: '2026-10-29'
                    dayOfWeek: Thursday
                    dishes: []
                  - date: '2026-10-30'
                    dayOfWeek: Friday
                    dishes: []
        '400':
          description: weekStart ausente, em formato inválido ou que não é segunda-feira.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ValidationProblemDetails'
              examples:
                notMonday:
                  summary: weekStart não é segunda
                  value:
                    type: https://tools.ietf.org/html/rfc9110#section-15.5.1
                    title: Um ou mais campos são inválidos.
                    status: 400
                    errors:
                      weekStart:
                        - A semana deve começar numa segunda-feira.
                    traceId: 00-4bf92f3577b34da6a3ce929d0e0e4736-00f067aa0ba902b7-01
                invalidFormat:
                  summary: weekStart ausente ou fora do formato
                  value:
                    type: https://tools.ietf.org/html/rfc9110#section-15.5.1
                    title: Um ou mais campos são inválidos.
                    status: 400
                    errors:
                      weekStart:
                        - Informe uma data válida no formato AAAA-MM-DD.
                    traceId: 00-4bf92f3577b34da6a3ce929d0e0e4736-00f067aa0ba902b7-01
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/dishes:
    post:
      tags: [Menu]
      operationId: createDish
      summary: Cadastra um prato num dia útil.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DishRequest'
            example:
              date: '2026-10-26'
              name: Feijoada
              description: Com arroz, couve e farofa
      responses:
        '201':
          description: Prato criado.
          headers:
            Location:
              description: URL do prato criado (`/api/dishes/{id}`).
              schema:
                type: string
              example: /api/dishes/1
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Dish'
              example:
                id: 1
                date: '2026-10-26'
                name: Feijoada
                description: Com arroz, couve e farofa
        '400':
          $ref: '#/components/responses/DishValidationError'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/dishes/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: Identificador do prato. Valor não inteiro não casa com a rota e responde 404.
        schema:
          type: integer
          format: int32
          minimum: 1
    get:
      tags: [Menu]
      operationId: getDish
      summary: Consulta um prato pelo id.
      responses:
        '200':
          description: Prato encontrado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Dish'
        '404':
          $ref: '#/components/responses/DishNotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    put:
      tags: [Menu]
      operationId: updateDish
      summary: Substitui data, nome e descrição de um prato.
      description: |
        Substituição completa: `description` ausente ou nula grava nulo.
        O corpo é validado antes da busca do prato: corpo inválido responde 400 mesmo para id inexistente.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DishRequest'
            example:
              date: '2026-10-26'
              name: Feijoada light
              description: null
      responses:
        '200':
          description: Prato alterado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Dish'
              example:
                id: 1
                date: '2026-10-26'
                name: Feijoada light
                description: null
        '400':
          $ref: '#/components/responses/DishValidationError'
        '404':
          $ref: '#/components/responses/DishNotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      tags: [Menu]
      operationId: deleteDish
      summary: Remove um prato.
      description: |
        Ordem de avaliação (ADR-017): prato inexistente responde 404; prato presente em algum
        pedido, de qualquer data, responde 409 e continua no cardápio; caso contrário é removido.
      responses:
        '204':
          description: Prato removido.
        '404':
          $ref: '#/components/responses/DishNotFound'
        '409':
          description: O prato está em ao menos um pedido e não pode ser removido.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: https://tools.ietf.org/html/rfc9110#section-15.5.10
                title: Prato com pedidos.
                status: 409
                detail: Este prato tem pedidos e não pode ser removido.
                traceId: 00-4bf92f3577b34da6a3ce929d0e0e4736-00f067aa0ba902b7-01
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/orders:
    post:
      tags: [Orders]
      operationId: createOrder
      summary: Cria o pedido de uma pessoa num dia útil.
      description: |
        Ordem de avaliação (ADR-014): formato (400) → pratos da data (400) → data passada ou
        dia encerrado (422) → pedido já existente para o nome e a data (409). Nada é gravado
        em caso de erro; cabeçalho e itens são gravados na mesma transação (RNF-05).
        O nome é gravado após o trim; a unicidade ignora maiúsculas e minúsculas, mas não acentos.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderRequest'
            example:
              name: Ana Souza
              date: '2026-10-28'
              items:
                - dishId: 3
                  quantity: 1
                - dishId: 4
                  quantity: 2
      responses:
        '201':
          description: Pedido criado.
          headers:
            Location:
              description: URL do pedido (`/api/orders?name={nome codificado}&date={yyyy-MM-dd}`).
              schema:
                type: string
              example: /api/orders?name=Ana%20Souza&date=2026-10-28
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
              example:
                name: Ana Souza
                date: '2026-10-28'
                items:
                  - dishId: 3
                    dishName: Frango grelhado
                    quantity: 1
                  - dishId: 4
                    dishName: Salada verde
                    quantity: 2
                createdAt: '2026-10-28T13:05:00Z'
                updatedAt: '2026-10-28T13:05:00Z'
        '400':
          $ref: '#/components/responses/OrderValidationError'
        '409':
          description: Já existe pedido para o nome (normalizado) e a data. O pedido existente não é alterado.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: https://tools.ietf.org/html/rfc9110#section-15.5.10
                title: Pedido já existe.
                status: 409
                detail: Já existe um pedido de Ana Souza para 28/10/2026. Altere o pedido existente.
                traceId: 00-4bf92f3577b34da6a3ce929d0e0e4736-00f067aa0ba902b7-01
        '422':
          $ref: '#/components/responses/OrderClosed'
        '500':
          $ref: '#/components/responses/InternalServerError'
    get:
      tags: [Orders]
      operationId: getOrder
      summary: Consulta o pedido de uma pessoa numa data.
      description: |
        Funciona para qualquer dia útil, inclusive datas passadas e dias encerrados.
        A busca ignora espaços nas pontas e maiúsculas/minúsculas do nome.
      parameters:
        - $ref: '#/components/parameters/OrderName'
        - $ref: '#/components/parameters/OrderDate'
      responses:
        '200':
          description: Pedido encontrado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '400':
          description: '`name` ou `date` ausente ou inválido (chaves `name` e `date`).'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ValidationProblemDetails'
              example:
                type: https://tools.ietf.org/html/rfc9110#section-15.5.1
                title: Um ou mais campos são inválidos.
                status: 400
                errors:
                  name:
                    - Informe o seu nome.
                traceId: 00-4bf92f3577b34da6a3ce929d0e0e4736-00f067aa0ba902b7-01
        '404':
          $ref: '#/components/responses/OrderNotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    put:
      tags: [Orders]
      operationId: updateOrder
      summary: Substitui todos os itens do pedido existente de uma pessoa numa data.
      description: |
        Não cria pedido e não altera o nome gravado. Os itens antigos são apagados e os novos
        gravados na mesma transação. Mesmas validações do POST; `name` e `date` vêm da query.
        Ordem de avaliação: formato (400) → pratos da data (400) → data passada ou dia
        encerrado (422) → pedido inexistente (404).
      parameters:
        - $ref: '#/components/parameters/OrderName'
        - $ref: '#/components/parameters/OrderDate'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderItemsRequest'
            example:
              items:
                - dishId: 4
                  quantity: 1
      responses:
        '200':
          description: Pedido alterado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
              example:
                name: Ana Souza
                date: '2026-10-28'
                items:
                  - dishId: 4
                    dishName: Salada verde
                    quantity: 1
                createdAt: '2026-10-28T13:05:00Z'
                updatedAt: '2026-10-28T14:10:00Z'
        '400':
          $ref: '#/components/responses/OrderValidationError'
        '404':
          $ref: '#/components/responses/OrderNotFound'
        '422':
          $ref: '#/components/responses/OrderClosed'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/orders/window:
    get:
      tags: [Orders]
      operationId: getOrderWindow
      summary: Informa o horário de corte de um dia útil e se ele ainda aceita pedidos.
      description: |
        Calculado com o relógio do servidor no fuso configurado (ADR-015). O frontend usa
        `cutoffTime` para exibir o corte e `isOpen` para decidir entre edição e somente leitura.
      parameters:
        - $ref: '#/components/parameters/OrderDate'
      responses:
        '200':
          description: Janela de pedidos do dia.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderWindow'
              example:
                date: '2026-10-28'
                cutoffTime: '12:00'
                timeZone: America/Sao_Paulo
                closesAt: '2026-10-28T12:00:00-03:00'
                isOpen: true
        '400':
          description: '`date` ausente, fora do formato ou em fim de semana (chave `date`).'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ValidationProblemDetails'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/health:
    get:
      tags: [Health]
      operationId: getHealth
      summary: Verifica a saúde da API e da conexão com o banco.
      responses:
        '200':
          description: API e dependências saudáveis.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthReport'
              example:
                status: Healthy
                checks:
                  - name: database
                    status: Healthy
        '503':
          description: Alguma dependência está indisponível.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthReport'
              example:
                status: Unhealthy
                checks:
                  - name: database
                    status: Unhealthy
        '500':
          $ref: '#/components/responses/InternalServerError'
components:
  schemas:
    HealthStatus:
      type: string
      enum: [Healthy, Degraded, Unhealthy]
    HealthCheckEntry:
      type: object
      required: [name, status]
      properties:
        name:
          type: string
          description: Identificador da verificação (ex.: database).
        status:
          $ref: '#/components/schemas/HealthStatus'
    HealthReport:
      type: object
      required: [status, checks]
      properties:
        status:
          $ref: '#/components/schemas/HealthStatus'
        checks:
          type: array
          items:
            $ref: '#/components/schemas/HealthCheckEntry'
    DayOfWeek:
      type: string
      description: Dia útil em inglês, como `System.DayOfWeek`. O frontend traduz o rótulo.
      enum: [Monday, Tuesday, Wednesday, Thursday, Friday]
    DishRequest:
      type: object
      description: |
        Corpo de POST e PUT. Regras validadas pela API (ADR-013):
        - `date`: obrigatório, `yyyy-MM-dd`, segunda a sexta.
        - `name`: obrigatório; espaços nas pontas são removidos; 1 a 100 caracteres após o trim.
        - `description`: opcional; espaços nas pontas são removidos; vazio vira null; até 300 caracteres após o trim.
        A API recebe `date` como texto e o valida ela mesma, para que formato inválido gere erro no campo `date`.
        Propriedades desconhecidas são ignoradas.
      required: [date, name]
      properties:
        date:
          type: string
          format: date
          example: '2026-10-26'
        name:
          type: string
          maxLength: 100
          example: Feijoada
        description:
          type: string
          nullable: true
          maxLength: 300
          example: Com arroz, couve e farofa
    Dish:
      type: object
      required: [id, date, name, description]
      properties:
        id:
          type: integer
          format: int32
        date:
          type: string
          format: date
        name:
          type: string
          maxLength: 100
        description:
          type: string
          nullable: true
          maxLength: 300
          description: Sempre presente na resposta; null quando não informada.
    WeekMenuDay:
      type: object
      required: [date, dayOfWeek, dishes]
      properties:
        date:
          type: string
          format: date
        dayOfWeek:
          $ref: '#/components/schemas/DayOfWeek'
        dishes:
          type: array
          description: Lista vazia quando o dia não tem pratos.
          items:
            $ref: '#/components/schemas/Dish'
    WeekMenu:
      type: object
      required: [weekStart, weekEnd, days]
      properties:
        weekStart:
          type: string
          format: date
          description: Segunda-feira informada.
        weekEnd:
          type: string
          format: date
          description: Sexta-feira da mesma semana (weekStart + 4 dias).
        days:
          type: array
          minItems: 5
          maxItems: 5
          items:
            $ref: '#/components/schemas/WeekMenuDay'
    OrderItemRequest:
      type: object
      description: |
        Item do pedido. Campos ausentes ou fora do intervalo geram erro em `errors.items`.
        Valor não inteiro é corpo malformado (400 sem `errors`, ADR-013).
      required: [dishId, quantity]
      properties:
        dishId:
          type: integer
          format: int32
          minimum: 1
          description: Prato cadastrado na mesma data do pedido.
        quantity:
          type: integer
          format: int32
          minimum: 1
          maximum: 10
    OrderItemsRequest:
      type: object
      description: |
        Corpo do PUT. `items`: obrigatório, 1 a 20 itens, sem `dishId` repetido.
        Propriedades desconhecidas são ignoradas.
      required: [items]
      properties:
        items:
          type: array
          minItems: 1
          maxItems: 20
          items:
            $ref: '#/components/schemas/OrderItemRequest'
    OrderRequest:
      type: object
      description: |
        Corpo do POST. Regras validadas pela API (ADR-013, ADR-014):
        - `name`: obrigatório; espaços nas pontas são removidos; 1 a 60 caracteres após o trim.
        - `date`: obrigatório, `yyyy-MM-dd`, segunda a sexta; recebido como texto.
        - `items`: como em `OrderItemsRequest`.
      required: [name, date, items]
      properties:
        name:
          type: string
          maxLength: 60
          example: Ana Souza
        date:
          type: string
          format: date
          example: '2026-10-28'
        items:
          type: array
          minItems: 1
          maxItems: 20
          items:
            $ref: '#/components/schemas/OrderItemRequest'
    OrderItem:
      type: object
      required: [dishId, dishName, quantity]
      properties:
        dishId:
          type: integer
          format: int32
        dishName:
          type: string
          maxLength: 100
        quantity:
          type: integer
          format: int32
          minimum: 1
          maximum: 10
    Order:
      type: object
      required: [name, date, items, createdAt, updatedAt]
      properties:
        name:
          type: string
          maxLength: 60
          description: Nome como foi gravado no POST (após o trim).
        date:
          type: string
          format: date
        items:
          type: array
          minItems: 1
          description: Itens em ordem de `dishId`.
          items:
            $ref: '#/components/schemas/OrderItem'
        createdAt:
          type: string
          format: date-time
          description: Instante da criação, em UTC.
        updatedAt:
          type: string
          format: date-time
          description: Instante da última alteração, em UTC (igual a `createdAt` se nunca alterado).
    OrderWindow:
      type: object
      required: [date, cutoffTime, timeZone, closesAt, isOpen]
      properties:
        date:
          type: string
          format: date
        cutoffTime:
          type: string
          pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'
          description: Horário de corte configurado (`HH:mm`), no fuso `timeZone`. Exibido como está.
          example: '12:00'
        timeZone:
          type: string
          description: Id IANA do fuso usado na regra.
          example: America/Sao_Paulo
        closesAt:
          type: string
          format: date-time
          description: Instante do corte deste dia, com o offset do fuso.
        isOpen:
          type: boolean
          description: |
            true se `date` é futura ou é hoje antes do corte; false se é passada ou é hoje a
            partir do corte.
    ProblemDetails:
      type: object
      description: Erro no formato RFC 9457 (application/problem+json).
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
          format: int32
        detail:
          type: string
        instance:
          type: string
        traceId:
          type: string
      additionalProperties: true
    ValidationProblemDetails:
      allOf:
        - $ref: '#/components/schemas/ProblemDetails'
        - type: object
          properties:
            errors:
              type: object
              additionalProperties:
                type: array
                items:
                  type: string
  parameters:
    OrderName:
      name: name
      in: query
      required: true
      description: Nome da pessoa (codificado na URL). Espaços nas pontas e maiúsculas/minúsculas são ignorados.
      schema:
        type: string
        maxLength: 60
      example: Ana Souza
    OrderDate:
      name: date
      in: query
      required: true
      description: Dia útil (`yyyy-MM-dd`). Sábado ou domingo responde 400 em `date`.
      schema:
        type: string
        format: date
      example: '2026-10-28'
  responses:
    OrderValidationError:
      description: |
        Requisição inválida (ADR-013, ADR-014). Chaves possíveis em `errors`: `name`, `date`, `items`.
        Todos os campos inválidos vêm juntos; erros de item ficam em `items` e citam o `dishId`.
        A checagem de pratos da data (prato inexistente ou de outro dia) só ocorre se o formato
        estiver válido. Nada é gravado.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ValidationProblemDetails'
          examples:
            format:
              summary: nome vazio, data em fim de semana e quantidade fora do intervalo
              value:
                type: https://tools.ietf.org/html/rfc9110#section-15.5.1
                title: Um ou mais campos são inválidos.
                status: 400
                errors:
                  name:
                    - Informe o seu nome.
                  date:
                    - Escolha um dia útil (segunda a sexta).
                  items:
                    - A quantidade do prato 3 deve ser de 1 a 10.
                traceId: 00-4bf92f3577b34da6a3ce929d0e0e4736-00f067aa0ba902b7-01
            emptyItems:
              summary: lista de itens vazia
              value:
                type: https://tools.ietf.org/html/rfc9110#section-15.5.1
                title: Um ou mais campos são inválidos.
                status: 400
                errors:
                  items:
                    - Adicione ao menos um prato ao pedido.
                traceId: 00-4bf92f3577b34da6a3ce929d0e0e4736-00f067aa0ba902b7-01
            dishNotOnMenu:
              summary: prato inexistente ou de outra data
              value:
                type: https://tools.ietf.org/html/rfc9110#section-15.5.1
                title: Um ou mais campos são inválidos.
                status: 400
                errors:
                  items:
                    - O prato 42 não está no cardápio de 28/10/2026.
                traceId: 00-4bf92f3577b34da6a3ce929d0e0e4736-00f067aa0ba902b7-01
    OrderNotFound:
      description: Não existe pedido para o nome e a data.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example:
            type: https://tools.ietf.org/html/rfc9110#section-15.5.5
            title: Pedido não encontrado.
            status: 404
